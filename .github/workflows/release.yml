name: Build and publish Windows installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install NSIS
        shell: pwsh
        run: |
          $nsisVersion = '3.13'
          $nsisArchive = Join-Path $env:RUNNER_TEMP "nsis-$nsisVersion.zip"
          $nsisDirectory = Join-Path $env:RUNNER_TEMP "nsis-$nsisVersion"
          Invoke-WebRequest -Uri "https://downloads.sourceforge.net/project/nsis/NSIS%203/$nsisVersion/nsis-$nsisVersion.zip" -OutFile $nsisArchive
          $actualHash = (Get-FileHash -Path $nsisArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne 'ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8') {
            throw 'O checksum SHA-256 do arquivo NSIS não confere.'
          }
          Expand-Archive -Path $nsisArchive -DestinationPath $env:RUNNER_TEMP -Force
          if (-not (Test-Path (Join-Path $nsisDirectory 'makensis.exe'))) {
            throw 'O arquivo makensis.exe não foi encontrado na extração do NSIS.'
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDirectory

      - name: Build installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          ./installer/Build-Installer.ps1 -Version $version -Runtime win-x64

      - name: Create checksum
        shell: pwsh
        run: |
          $installer = Get-Item 'artifacts/installer/JMD-*-win-x64-setup.exe' | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Path "$($installer.FullName).sha256" -Encoding ascii

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-Item 'artifacts/installer/JMD-*-win-x64-setup.exe' | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME $installer.FullName "$($installer.FullName).sha256" --generate-notes
