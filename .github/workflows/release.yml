name: Build and publish Windows installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install NSIS
        shell: pwsh
        run: |
          $nsisVersion = '3.13'
          $nsisInstaller = Join-Path $env:RUNNER_TEMP "nsis-$nsisVersion-setup.exe"
          $nsisDirectory = Join-Path $env:RUNNER_TEMP "nsis-$nsisVersion"
          Invoke-WebRequest -Uri "https://downloads.sourceforge.net/project/nsis/NSIS%203/$nsisVersion/nsis-$nsisVersion-setup.exe" -OutFile $nsisInstaller
          $actualHash = (Get-FileHash -Path $nsisInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne 'db9a1038bbc0e53fe24f423fd609979bd578e942f1be1198db186d1c42652a3') {
            throw "O checksum SHA-256 do instalador NSIS não confere: $actualHash"
          }
          $process = Start-Process -FilePath $nsisInstaller -ArgumentList @('/S', "/D=$nsisDirectory") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "A instalação silenciosa do NSIS falhou com código $($process.ExitCode)."
          }
          if (-not (Test-Path (Join-Path $nsisDirectory 'makensis.exe'))) {
            throw 'O arquivo makensis.exe não foi encontrado após instalar o NSIS.'
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDirectory

      - name: Build installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          ./installer/Build-Installer.ps1 -Version $version -Runtime win-x64

      - name: Create checksum
        shell: pwsh
        run: |
          $installer = Get-Item 'artifacts/installer/JMD-*-win-x64-setup.exe' | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Path "$($installer.FullName).sha256" -Encoding ascii

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-Item 'artifacts/installer/JMD-*-win-x64-setup.exe' | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME $installer.FullName "$($installer.FullName).sha256" --generate-notes
