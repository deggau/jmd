name: Build and publish Windows installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Add NSIS to PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files (x86)\NSIS'

      - name: Build installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          ./installer/Build-Installer.ps1 -Version $version -Runtime win-x64

      - name: Create checksum
        shell: pwsh
        run: |
          $installer = Get-Item 'artifacts/installer/DevToolbox-*-win-x64-setup.exe' | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Path "$($installer.FullName).sha256" -Encoding ascii

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-Item 'artifacts/installer/DevToolbox-*-win-x64-setup.exe' | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME $installer.FullName "$($installer.FullName).sha256" --generate-notes
