name: Build and publish Windows installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout whisper.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: v1.9.5
          path: whisper.cpp

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install NSIS
        shell: pwsh
        run: |
          $nsisVersion = '3.12'
          $nsisPackage = Join-Path $env:RUNNER_TEMP "nsis.install.$nsisVersion.0.nupkg"
          $nsisPackageDirectory = Join-Path $env:RUNNER_TEMP "nsis.install-$nsisVersion"
          $nsisInstaller = Join-Path $nsisPackageDirectory "tools/nsis-$nsisVersion-setup.exe"
          $nsisDirectory = Join-Path $env:RUNNER_TEMP "nsis-$nsisVersion"
          Invoke-WebRequest -Uri "https://community.chocolatey.org/api/v2/package/nsis.install/$nsisVersion.0" -OutFile $nsisPackage
          $actualPackageHash = [Convert]::ToBase64String([Security.Cryptography.SHA512]::HashData([IO.File]::ReadAllBytes($nsisPackage)))
          if ($actualPackageHash -ne '5wV68I/5xaZE6XrXEiivOO3Ry3el4r2SEHpjom87WEWQduproVO9AKBwaQJLUvJgdCFy9Uxa0UMMZlIgOPub2w==') {
            throw "O checksum SHA-512 do pacote NSIS não confere: $actualPackageHash"
          }
          Expand-Archive -Path $nsisPackage -DestinationPath $nsisPackageDirectory -Force
          $actualInstallerHash = (Get-FileHash -Path $nsisInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualInstallerHash -ne '3bc2b06253a7e4957111be152ac6a536e0c7478a706e19da814038db5d706495') {
            throw "O checksum SHA-256 do instalador NSIS não confere: $actualInstallerHash"
          }
          $process = Start-Process -FilePath $nsisInstaller -ArgumentList @('/S', "/D=$nsisDirectory") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "A instalação silenciosa do NSIS falhou com código $($process.ExitCode)."
          }
          if (-not (Test-Path (Join-Path $nsisDirectory 'makensis.exe'))) {
            throw 'O arquivo makensis.exe não foi encontrado após instalar o NSIS.'
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDirectory

      - name: Build whisper.cpp for Windows 10
        shell: pwsh
        run: |
          cmake -S whisper.cpp -B whisper.cpp/build -A x64 `
            -DWHISPER_BUILD_TESTS=OFF `
            -DWHISPER_BUILD_EXAMPLES=ON `
            -DWHISPER_BUILD_SERVER=OFF `
            -DGGML_NATIVE=OFF `
            -DGGML_AVX=OFF `
            -DGGML_AVX2=OFF `
            -DGGML_FMA=OFF `
            -DGGML_OPENMP=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build whisper.cpp/build --config Release --target whisper-cli
          if ($LASTEXITCODE -ne 0) { throw "A compilação do whisper.cpp falhou com código $LASTEXITCODE" }
          $whisperCli = Get-ChildItem whisper.cpp/build -Filter 'whisper-cli.exe' -Recurse -File | Select-Object -First 1
          if (-not $whisperCli) { throw 'whisper-cli.exe não encontrado após a compilação.' }
          Copy-Item whisper.cpp/LICENSE (Join-Path $whisperCli.DirectoryName 'LICENSE-whisper.cpp.txt')
          "WHISPER_RUNTIME_DIRECTORY=$($whisperCli.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download llama.cpp runtime for Gemma audio
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'llama-b11429-bin-win-cpu-x64.zip'
          $runtime = Join-Path $env:RUNNER_TEMP 'llama-runtime'
          Invoke-WebRequest -Uri 'https://github.com/ggml-org/llama.cpp/releases/download/b11429/llama-b11429-bin-win-cpu-x64.zip' -OutFile $archive
          $actualHash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne '1283323272b04cd07905816a597a0da810918102de958f4ff6f7bbaa70ed2efe') {
            throw "Checksum SHA-256 do runtime llama.cpp inválido: $actualHash"
          }
          Expand-Archive -Path $archive -DestinationPath $runtime -Force
          $llamaCli = Get-ChildItem $runtime -Filter 'llama-mtmd-cli.exe' -Recurse -File | Select-Object -First 1
          if (-not $llamaCli) { throw 'llama-mtmd-cli.exe não encontrado no runtime oficial.' }
          $license = Get-ChildItem $runtime -Filter 'LICENSE' -Recurse -File | Select-Object -First 1
          if (-not $license) { throw 'Licença não encontrada no runtime oficial do llama.cpp.' }
          Copy-Item $license.FullName (Join-Path $llamaCli.DirectoryName 'LICENSE') -Force
          "LLAMA_RUNTIME_DIRECTORY=$($llamaCli.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          ./installer/Build-Installer.ps1 -Version $version -Runtime win-x64 -WhisperRuntimeDirectory $env:WHISPER_RUNTIME_DIRECTORY -LlamaRuntimeDirectory $env:LLAMA_RUNTIME_DIRECTORY

      - name: Create checksum
        shell: pwsh
        run: |
          $installer = Get-Item 'artifacts/installer/JMD-*-win-x64-setup.exe' | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Path "$($installer.FullName).sha256" -Encoding ascii

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-Item 'artifacts/installer/JMD-*-win-x64-setup.exe' | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME $installer.FullName "$($installer.FullName).sha256" --generate-notes
